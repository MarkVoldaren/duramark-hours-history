services:
  app:
    build: .
    container_name: duramark-hours-history
    restart: unless-stopped
    volumes:
      - ./data:/data
    networks:
      - apps_proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  apps_proxy:
    external: true
